<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ashwani AI System</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

<style>

body {
    margin: 0;
    background: black;
    color: #00fff7;
    font-family: 'Orbitron', sans-serif;
    overflow: hidden;
}

/* Center Screen */
.container {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}

/* Typing */
.typing {
    font-size: 24px;
    border-right: 2px solid #00fff7;
    white-space: nowrap;
    overflow: hidden;
    width: 0;
    animation: typing 3s steps(30) forwards, blink .7s infinite;
}

@keyframes typing {
    to { width: 100%; }
}

@keyframes blink {
    50% { border-color: transparent; }
}

/* Button */
.btn {
    margin-top: 40px;
    padding: 12px 30px;
    border: 1px solid #00fff7;
    cursor: pointer;
    transition: 0.3s;
}

.btn:hover {
    background: #00fff7;
    color: black;
}

</style>

</head>

<body>

<div class="container">
    <div class="typing">Initializing Ashwani Kumar...</div>
    <div class="typing" style="animation-delay:3s;">AI Builder | Digital Operator | System Creator</div>
    <div class="btn" onclick="enter()">ENTER SYSTEM</div>
</div>

<script>
function enter(){
    document.body.innerHTML = `
    <div style="padding:40px;font-family:sans-serif;color:white">
    <h1>Welcome to my AI Portfolio</h1>
    <p>This is just the beginning...</p>
    </div>
    `;
}
</script>

</body>
</html>
